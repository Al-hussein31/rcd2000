[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rcd2000"
version = "1.0.0"
description = "Reinforced Concrete Design to BS 8110 - Modern port of Oyenuga's RCD2000"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "RCD2000 Contributors"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Engineering",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Al-hussein31/rcd2000"
Repository = "https://github.com/Al-hussein31/rcd2000"

[tool.setuptools]
package-data = {"rcd2000" = ["gui/icons/*", "*.svg"]}

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]
gui = [
    "PySide6>=6.6",
]

[project.scripts]
rcd2000 = "rcd2000.cli:app"
rcd2000-gui = "rcd2000.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
strict = false
python_version = "3.11"
