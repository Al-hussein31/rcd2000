name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            pyinstaller_flags: --onefile
            icon_flag: ""
            sep: ":"
            uploaded_asset: dist/RCD2000-linux

          - os: macos-latest
            pyinstaller_flags: --windowed
            icon_flag: --icon src/rcd2000/gui/icons/logo.icns
            sep: ":"
            uploaded_asset: dist/RCD2000-macos.zip

          - os: windows-latest
            pyinstaller_flags: --onefile --windowed
            icon_flag: --icon src/rcd2000/gui/icons/logo.ico
            sep: ";"
            uploaded_asset: dist/RCD2000-windows.exe

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libegl1 libglib2.0-0t64 \
            libxcb-cursor0 libxkbcommon0 libfontconfig1 2>&1 | tail -5

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e ".[gui]"

      - name: Build with PyInstaller
        shell: bash
        run: |
          pyinstaller \
            ${{ matrix.pyinstaller_flags }} \
            --clean \
            --noconfirm \
            --name RCD2000 \
            ${{ matrix.icon_flag }} \
            --add-data "src/rcd2000/gui/icons${{ matrix.sep }}rcd2000/gui/icons" \
            --hidden-import qtawesome \
            --hidden-import PySide6.QtSvg \
            --hidden-import PySide6.QtXml \
            run_gui.py

      - name: Package .app into zip (macOS)
        if: runner.os == 'macOS'
        run: |
          ditto -c -k --sequesterRsrc dist/RCD2000.app dist/RCD2000-macos.zip
          ls -lh dist/RCD2000-macos.zip

      - name: Rename executable (Linux)
        if: runner.os == 'Linux'
        run: mv dist/RCD2000 dist/RCD2000-linux

      - name: Rename executable (Windows)
        if: runner.os == 'Windows'
        run: mv dist/RCD2000.exe dist/RCD2000-windows.exe

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.uploaded_asset }}
