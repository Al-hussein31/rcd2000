name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  #################################################
  # macOS — .dmg with drag-to-Applications UX
  #################################################
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deps
        run: |
          brew install create-dmg
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e ".[gui]"

      - name: Build .app with PyInstaller
        run: |
          pyinstaller \
            --windowed \
            --clean \
            --noconfirm \
            --name RCD2000 \
            --icon src/rcd2000/gui/icons/logo.icns \
            --add-data "src/rcd2000/gui/icons:rcd2000/gui/icons" \
            --hidden-import qtawesome \
            --hidden-import PySide6.QtSvg \
            --hidden-import PySide6.QtXml \
            run_gui.py

      - name: Ad-hoc sign .app (required for Apple Silicon)
        run: |
          codesign --force --deep -s - dist/RCD2000.app

      - name: Create DMG
        run: |
          cp HOW_TO_OPEN.txt dist/
          create-dmg \
            --volname "RCD2000" \
            --window-size 540 400 \
            --icon-size 96 \
            --icon "RCD2000.app" 130 200 \
            --icon "HOW_TO_OPEN.txt" 270 200 \
            --app-drop-link 410 200 \
            --no-internet-enable \
            --hdiutil-retries 5 \
            "RCD2000-macos.dmg" \
            "dist/"

      - name: Upload asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: RCD2000-macos.dmg

  #################################################
  # Windows — Inno Setup installer
  #################################################
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deps
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -e ".[gui]"
          choco install innosetup --no-progress -y

      - name: Build with PyInstaller (onedir)
        shell: pwsh
        run: |
          pyinstaller `
            --onedir `
            --windowed `
            --clean `
            --noconfirm `
            --name RCD2000 `
            --icon src/rcd2000/gui/icons/logo.ico `
            --add-data "src/rcd2000/gui/icons;rcd2000/gui/icons" `
            --hidden-import qtawesome `
            --hidden-import PySide6.QtSvg `
            --hidden-import PySide6.QtXml `
            run_gui.py

      - name: Build installer with Inno Setup
        shell: cmd
        run: |
          "C:\Program Files (x86)\Inno Setup 6\iscc.exe" installer.iss

      - name: Upload asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: RCD2000-windows.exe

  #################################################
  # Linux — AppImage
  #################################################
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui]"
          pip install appimage

      - name: Build AppImage
        run: |
          python -m appimage.build
          mv dist/*.AppImage RCD2000-linux.AppImage

      - name: Upload asset
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: RCD2000-linux.AppImage
